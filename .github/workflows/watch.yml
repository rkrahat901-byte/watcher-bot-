name: Watcher Bot

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, at minute 17 (GitHub may delay it)
  workflow_dispatch:
    inputs:
      test_message:
        description: "Only send a Telegram test message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.test_message }}" = "true" ]; then
            python watcher.py --test
          else
            python watcher.py
          fi

      - name: Save snapshots
        run: |
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "Update snapshots" && git push)

